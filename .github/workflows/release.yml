name: release

# Publishes the workspace's crates to crates.io when a version tag is pushed.
#
# Requires a repository secret `CARGO_REGISTRY_TOKEN` (a crates.io API token).
# Add it under: Settings → Secrets and variables → Actions → New repository secret.
#
# Crates are published in dependency order; `cargo publish` waits for each to
# appear on the index before the next (dependent) crate is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify the whole workspace
        run: cargo test --all-features

      - name: Publish crates to crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          for crate in \
            tableflow-core \
            tableflow-schema \
            tableflow-export \
            tableflow-xlsx \
            tableflow-geojson \
            tableflow-autoreport \
            tableflow \
            tableflow-cli
          do
            echo "::group::publish $crate"
            # Up to 3 attempts: skip if already uploaded; wait out crates.io's
            # new-crate rate limit (HTTP 429) and retry; fail on anything else.
            for attempt in 1 2 3; do
              if out=$(cargo publish -p "$crate" 2>&1); then
                echo "$out"
                echo "published $crate"
                break
              fi
              echo "$out"
              if echo "$out" | grep -qiE "already (uploaded|exists)"; then
                echo "$crate already published, skipping"
                break
              fi
              if echo "$out" | grep -qi "429 Too Many Requests"; then
                echo "rate limited on $crate; waiting 11 minutes (attempt $attempt)"
                sleep 660
                continue
              fi
              echo "failed to publish $crate"
              exit 1
            done
            echo "::endgroup::"
          done
