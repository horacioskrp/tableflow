[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["KARFI"]
repository = "https://github.com/horacioskrp/tableflow"

[workspace.dependencies]
# Internal crates
tableflow-core = { path = "crates/tableflow-core", version = "0.1.2" }
tableflow-schema = { path = "crates/tableflow-schema", version = "0.1.2" }
tableflow-export = { path = "crates/tableflow-export", version = "0.1.2" }
tableflow-xlsx = { path = "crates/tableflow-xlsx", version = "0.1.2" }
tableflow-geojson = { path = "crates/tableflow-geojson", version = "0.1.2" }
tableflow-autoreport = { path = "crates/tableflow-autoreport", version = "0.1.2" }
tableflow = { path = "crates/tableflow", version = "0.1.2" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rust_xlsxwriter = "0.90"
calamine = "0.31"
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
